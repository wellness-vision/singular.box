<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f7f7f7;color:#222}main{height:100dvh;display:flex;flex-direction:column}header{padding:16px 22px;background:white;border-bottom:1px solid #e8e8e8}h1{font-size:17px;margin:0;font-weight:600}.viewer{position:relative;flex:1;min-height:0}model-viewer{width:100%;height:100%;background:#f7f7f7}#error{display:none;position:absolute;left:16px;right:16px;top:16px;background:#fff4f4;border:1px solid #e7b7b7;border-radius:8px;padding:14px;font-size:14px}footer{padding:10px 18px;background:white;text-align:center;font-size:12px;color:#666;border-top:1px solid #e8e8e8}
</style>
</head>
<body><main>
<header><h1>Modelo 3D</h1></header>
<div class="viewer">
<model-viewer id="model" src="./modelo.glb" alt="Modelo arquitectónico en 3D" camera-controls auto-rotate interaction-prompt="auto" shadow-intensity="0.6" environment-image="neutral" exposure="1" loading="eager" reveal="auto" ar ar-modes="webxr scene-viewer quick-look">
<div slot="progress-bar" style="position:absolute;bottom:12px;left:12px;right:12px;height:3px;background:#ddd"><div id="progress" style="width:0;height:100%;background:#777"></div></div>
</model-viewer>
<div id="error">No se ha podido cargar el modelo. Comprueba que <strong>modelo.glb</strong> esté en la misma carpeta que <strong>index.html</strong> y que estés abriendo el enlace de GitHub Pages, no el archivo HTML directamente desde Finder.</div>
</div><footer>Arrastra para girar · Desplaza para acercar y alejar</footer>
</main>
<script>
const model=document.getElementById('model');
model.addEventListener('error',()=>document.getElementById('error').style.display='block');
model.addEventListener('progress',e=>{document.getElementById('progress').style.width=(e.detail.totalProgress*100)+'%';});
</script>
</body></html>
